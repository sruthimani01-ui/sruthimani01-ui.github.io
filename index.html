      type: "School",
      course: "Engineering",
      year: "2022",
      role: "CAD Designer",
      emoji: "💨",
      color: "tomato",
      image: "https://framerusercontent.com/images/4oZMSewHn50qlFfMoXziFKYO6V8.png",
      blurb: "A full-size, fully reassemblable CAD model of every part of a hair dryer.",
      details: "I took apart a hair dryer, measured every component, modeled each one in CAD, and assembled them into a complete digital mockup that can be used for product analysis or redesign.",
      highlights: [],
      tools: ["CAD", "Reverse engineering"],
      link: "https://sruthimani.framer.website/works/hairdryer"
    }
  ]
};

/* ============ end of content, the rest builds the page ============ */

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const col = p => `var(--${p.color || "sky"})`;

document.title = CONTENT.name + " | Portfolio";
$("navName").textContent = CONTENT.name;
$("tagline").textContent = CONTENT.tagline;
$("intro").textContent = CONTENT.intro;
$("footer").textContent = `© ${new Date().getFullYear()} ${CONTENT.name}`;

/* name: letters get bolder near the cursor */
const nameEl = $("name");
nameEl.setAttribute("aria-label", CONTENT.name);
const words = CONTENT.name.split(" ");
words.forEach((word, wi) => {
  const w = el("span", "word"); w.setAttribute("aria-hidden", "true");
  [...word].forEach(ch => w.append(el("span", "letter", ch)));
  if (wi === words.length - 1) w.append(el("span", "dot", "."));
  nameEl.append(w);
});
const letters = [...nameEl.querySelectorAll(".letter")];
nameEl.addEventListener("pointermove", e => {
  letters.forEach(l => {
    const r = l.getBoundingClientRect();
    const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
    const t = Math.max(0, 1 - d / 220);
    l.style.fontWeight = Math.round(300 + t * 500);
  });
});
nameEl.addEventListener("pointerleave", () => letters.forEach(l => l.style.fontWeight = ""));

/* filters */
const types = ["All", ...new Set(CONTENT.projects.map(p => p.type))];
let current = "All";
types.forEach(t => {
  const b = el("button", "tab", t); b.type = "button";
  b.setAttribute("aria-pressed", t === current);
  b.addEventListener("click", () => {
    current = t;
    document.querySelectorAll(".tab").forEach(c => c.setAttribute("aria-pressed", c.textContent === t));
    renderProjects();
  });
  $("filters").append(b);
});

function fillArt(box, p) {
  box.innerHTML = ""; box.style.background = col(p);
  if (p.image) { const img = el("img"); img.src = p.image; img.alt = ""; box.append(img); }
  else box.textContent = p.emoji || "✨";
}

/* cursor-following preview */
const preview = $("preview");
let px = 0, py = 0, tx = 0, ty = 0;
document.addEventListener("pointermove", e => { tx = e.clientX + 24; ty = e.clientY - 110; });
(function follow() {
  px += (tx - px) * .18; py += (ty - py) * .18;
  preview.style.transform = `translate(${px}px, ${py}px)`;
  requestAnimationFrame(follow);
})();

function renderProjects() {
  const list = $("list"); list.innerHTML = "";
  const items = CONTENT.projects.filter(p => current === "All" || p.type === current);
  if (!items.length) { list.append(el("li", "empty", "No projects here yet.")); return; }
  items.forEach(p => {
    const li = el("li");
    const b = el("button", "row"); b.type = "button";
    const sw = el("span", "swatch"); sw.style.background = col(p);
    const title = el("span", "row-title", p.title);
    title.append(el("span", "row-blurb", p.blurb));
    b.append(sw, title, el("span", "row-course", p.course), el("span", "row-year", p.year));
    b.addEventListener("mouseenter", () => { fillArt(preview, p); preview.classList.add("show"); });
    b.addEventListener("mouseleave", () => preview.classList.remove("show"));
    b.addEventListener("click", () => { preview.classList.remove("show"); openProject(p); });
    li.append(b); list.append(li);
  });
}

function openProject(p) {
  const box = $("dlgContent"); box.innerHTML = "";
  const art = el("div", "dlg-art"); fillArt(art, p);
  const body = el("div", "dlg-body");
  const h = el("h3", null, p.title); h.id = "dlgTitle";
  body.append(h, el("p", "dlg-meta", `${p.course}, ${p.year}`));
  if (p.role) body.append(el("p", "dlg-role", p.role));
  body.append(el("p", null, p.details));
  if (p.highlights && p.highlights.length) {
    const hl = el("ul", "highlights"); p.highlights.forEach(t => hl.append(el("li", null, t))); body.append(hl);
  }
  if (p.tools && p.tools.length) {
    const ul = el("ul", "tools"); p.tools.forEach(t => ul.append(el("li", null, t))); body.append(ul);
  }
  if (p.gallery && p.gallery.length) {
    const g = el("div", "gallery");
    p.gallery.forEach(item => {
      const fig = el("figure");
      let media;
      if (/\.(mp4|webm|mov)$/i.test(item.src)) {
        media = el("video"); media.src = item.src; media.controls = true; media.playsInline = true;
        media.preload = "metadata"; if (item.poster) media.poster = item.poster;
      } else {
        media = el("img"); media.src = item.src; media.alt = item.caption || ""; media.loading = "lazy";
      }
      fig.append(media);
      if (item.caption) fig.append(el("figcaption", null, item.caption));
      g.append(fig);
    });
    body.append(g);
  }
  if (p.link) {
    const a = el("a", "link", "See the full project"); a.href = p.link; a.target = "_blank"; a.rel = "noopener"; body.append(a);
  }
  box.append(art, body);
  $("dlg").classList.toggle("has-gallery", !!(p.gallery && p.gallery.length));
  $("dlg").showModal();
}
$("dlgClose").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("close", () => $("dlgContent").querySelectorAll("video").forEach(v => v.pause()));
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });
renderProjects();

/* about + contact */
CONTENT.about.forEach(t => $("aboutText").append(el("p", null, t)));
if (CONTENT.skills) { const sk = el("ul", "skills"); CONTENT.skills.forEach(t => sk.append(el("li", null, t))); $("aboutText").append(sk); }
CONTENT.now.forEach(t => $("nowList").append(el("li", null, t)));
$("email").textContent = CONTENT.email;
$("email").href = "mailto:" + CONTENT.email;
CONTENT.socials.forEach(s => {
  const li = el("li"); const a = el("a", null, s.label);
  a.href = s.url; a.target = "_blank"; a.rel = "noopener";
  li.append(a); $("socials").append(li);
});
</script>
</body>
</html>
